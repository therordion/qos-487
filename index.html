    // document mints the blobs for its OWN frames, obtaining page text

    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

    const resourceBlobs = {};

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;

      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');

      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

 Луны (точно 27,32 суток, расхождение 1,2 %; у привычного синодического месяца 29,53 суток расхождение было бы 8,6 %), а 9 — естественный размер малой группы внутри 27. Это объясняет, почему выбраны именно эти числа; астрономическим утверждением оно не является.',\n    helpSeam:'Четыре обычных года — это 1461 день, а 1461 на 27 не делится: остаются три лишних дня. Их раскладывают по одному на год, поэтому последняя деля года становится десятидневной, а последний, 18-й месяц — 28-дневным. Этот лишний день и есть шов: 487-й день года, адрес 18·3·10. Так удобнее, чем оставлять дни «вне счёта»: ни один день не выпадает, у каждого есть адрес, и на шов можно поставить событие. Если четырёхлетие задевает февраль невисокосного столетия (2100, 2200, 2300), в нём 1460 дней — тогда третий год цикла получает 486 дней и шва в нём нет.',\n    helpRhythmNote:'месяц года (1–18) · деля в месяце (1–3) · день в деле (1–9, у шва — 10)',\n    helpAddrNote:'цикл.год цикла (1–3) : месяц (01–18) : день месяца (01–27, а в последнем месяце длинного года — 28)',\n    helpBridgeNote:'Мост показывает, как номер дня года складывается из целых частей: 27×8 + 9×1 + 7 = 232.',\n    helpSecToday:'Выбранный день крупно и сразу в двух календарях: обычная дата, ритм, адрес и место внутри года.',\n    helpSecGrids:'Главный экран: слева обычный месяц, справа специальный год. Один и тот же день подсвечен в обеих сетках и соединён нитью.',\n    helpSecCircle:'Точка — месяц, блок — цикл; в блоке три строки-года по 18 месяцев. Наверху переключается охват: отдельный цикл в 1461 день или весь круг в 13 149 дней (36 лет). Клик по месяцу открывает его первое число в «Сетках».',\n    helpSecEvents:'Ближайшие события с повторами; здесь же добавляются новые.',\n    helpSecSettings:'Тема, вид нити, свои названия единиц, точка отсчёта, напоминания и выгрузка данных.',\n    helpThread:'Нить соединяет один и тот же день в обычной и в специальной сетке. Нажмите на любой день — вторая сетка подсветит тот же день, а подпи ',\n    installIphone:'iPhone: open this page in Safari, tap “Share” → “Add to Home Screen”. The app will start full screen and work without the internet.',\n    installAndroidBtn:'Android: tap the button below — the app will go to the home screen and then work without the internet.',\n    installAndroidMenu:'Android: browser menu → “Install app” (or “Add to Home screen”). Once installed, the internet is not needed. On an iPhone — Safari → “Share” → “Add to Home Screen”.',\n    notifUnsupported:'The browser does not support notifications.',\n    notifGranted:'Permission granted. A reminder is checked every 30 seconds and fires once a day.',\n    notifDenied:'Permission denied — turn it on in the browser settings.',\n    notifDefault:'Permission has not been requested yet.',\n    notifTestBodyA:'Test: today ',\n    icsFileName:'two-calendars.ics', jsonFileName:'two-calendars.json', icsNoTitle:'Untitled',\n    icsRhythm:'Rhythm ', icsAddr:' · address ',\n    docTitle:'QOS · two calendars',\n    docDesc:'A full round is 27 years by the special calendar, or 36 by the ordinary one: exactly how long it takes before the count meets the same point of the year. Any day is visible in both counts at once, and time starts to feel different — more even, more natural. QOS stands for quadringentī octōgintā septem, “four hundred and eighty-seven” in Latin. Three rounds in a lifetime is already a feat, four is the next level, five is out of reach today. QOS invites you to measure life in rounds rather than years — and that is a reason to live longer.',\n    settingsHelpSub:'What a Delya, a month, a period and the seam are, and how to read the address',\n    secViewCap:'Appearance', secDefaultsCap:'Open by default', secNamesCap:'Names',\n    secNotifyCap:'Notifications', secEpochCap:'The epoch', secCalendarCap:'Calendar',\n    secInstallCap:'Install on your phone', secDataCap:'Data',\n    quickPairCap:'Quick switch in the header',\n    quickAria1:'First theme of the quick switch', quickAria2:'Second theme of the quick switch',\n    quickNote:'The button in the header switches between these two themes and is labelled with the one it will switch to. If the current theme is not one of the pair, the button leads to the first.',\n    themeNote:'A theme changes colours only: the grids, the ring, the events and the captions are repainted as a whole. “Graphite” is the only theme with a different geometry: it has square corners.',\n    startTabCap:'Section at launch', circleViewCap:'Look in “Circle”',\n    defaultsNote:'The section at launch is the screen the app opens on. The look in “Circle” is the same setting as the switch inside the section, and it applies to the “36 years” span.',\n    threadAria:'How the thread looks',\n    nameHelpAria:'What is compared with what',\n    nameHelpNote:'A comparison with the ordinary calendar. On the left is your name, on the right how many days it is and what it resembles in an ordinary year.',\n    namesNote:'Here any of our names can be replaced with your own. The new word appears everywhere the label is. An empty field restores the original name. It does not affect any calculations.',\n    namesUnitsCap:'Units', namesPeriodsCap:'Periods of the year', namesDelyasCap:'Delyas of the month',\n    resetNamesBtn:'Restore the originals',\n    namesHelpNote2:'In the help and in the explanations the names stay original: there they explain how the calendar works rather than label things.',\n    notifOnCap:'Remind me in the browser', notifTest:'Test the notification', exportIcsBtn:'Export .ics',\n    notifNote:'On an iPhone browser notifications are unreliable. It is safer to export .ics and open it in the phone calendar: ordinary repeats are carried by the calendar’s own repeat, and special ones as a list of the next 60 dates.',\n    epochFromSelBtn:'Use the selected day', epochResetBtn:'Back to 21.12.2025',\n    epochTodayCap:'Today becomes: ', epochCycleCap:'Current cycle: ',\n    epochNote:'The drift against the ordinary calendar stays zero for any date: a cycle always starts on the same date once every four years. Events and notes will not move — they are kept by day number, only their special addresses change. 29 February is brought to the 28th.',\n    epochLineFmt:'{a} · rhythm {r} · day {d} of {y} · from the epoch {e}', cycleWord:'cycle',\n    refEpoch:'Epoch', refYearDays:'487 days', refCycleDays:'1461 days = 4 Gregorian years',\n    refRingDays:'13 149 days = 36 years', refToday:'Today', refDrift:'Drift', refDriftVal:'zero days forever',\n    installBtn:'Install the app',\n    exportJsonBtn:'Export JSON', importJsonBtn:'Import JSON', copyDataBtn:'Copy the data',\n    pasteDataBtn:'Paste the data', clearBtn:'Clear', clearDemoBtn:'Remove the examples',\n    pastePh:'paste what you copied here…', pasteAria:'Data to paste',\n    readClipBtn:'Read the clipboard', applyBtn:'Apply',\n    nameHint_day:' · 1 day', nameHint_delya:' · 9 days', nameHint_month:' · 27 days',\n    nameHint_period:' · 162 days', nameHint_year:' · 487 days', nameHint_cycle:' · 1461 days',\n    nameHint_ring:' · 13 149 days',\n    nameHint_p1:' · 1st period of the year', nameHint_p2:' · 2nd', nameHint_p3:' · 3rd',\n    nameHint_d1:' · 1st Delya of the month', nameHint_d2:' · 2nd', nameHint_d3:' · 3rd',\n    nameCmpDay:'1 day. Just like an ordinary day.',\n    nameCmpDelya:'9 days, the last one in the year 10. The closest thing in an ordinary year is a week, but it is two days shorter: a week has 7.',\n    nameCmpMonth:'27 days, the last one in the year 28. An ordinary month is longer: 28–31 days. A special year has 18 such months, not 12.',\n    nameCmpPeriod:'162 days, the third one in the year 163. That is about half a year: an ordinary half-year is 181–184 days. A year has three periods.',\n    nameCmpYear:'487 days. An ordinary year is 365, so a special year is almost a third longer.',\n    nameCmpCycle:'1461 days — exactly four ordinary years, day for day. That is three special years.',\n    nameCmpRing:'13 149 days — exactly 36 ordinary years. Nine cycles, after which the count meets the same point of the year.',\n    nameCompareA:'Periods of the year and Delyas of the month are fractions: ',\n    nameCompareB:' split the year into three parts of 162 days, and ',\n    nameCompareC:' split a month into three parts of 9 days. Your word is substituted here as well.',\n    thread_lane:'lane', thread_arc:'arc', thread_line:'line', thread_off:'off',\n    thread_lane_hint:'Runs through the gaps between rows and columns — it covers no cell. The tidiest option.',\n    thread_arc_hint:'A semicircle from one day to the other. It passes over the grids, but reads as a single movement.',\n    thread_line_hint:'The shortest segment between two days. As simple and unobtrusive as possible.',\n    thread_off_hint:'No thread. The twin day is still highlighted in the other grid, and the caption says which day it is in the other calendar.',\n    helpCardWhy:'Why two calendars', helpCardUnits:'Units', helpCardWhy279:'Why 27 and 9',\n    helpCardSeam:'The seam', helpCardRead:'How to read the rhythm and the address',\n    helpCardThread:'The thread between the grids', helpCardEvents:'Events and repeats', helpCardControls:'Controls',\n    helpWhy1a:'The app is called ', helpWhy1b:' — short for ',\n    helpWhy1c:', “four hundred and eighty-seven” in Latin. That is how many days a special year has.',\n    helpWhy2a:'A full round is 27 years by the special calendar, or 36 by the ordinary one.',\n    helpWhy2b:' That is exactly how long it takes before the count meets the same point of the year again. Over such a stretch you see how time is built rather than a list of dates — and time begins to feel different: more even, more natural.',\n    helpWhy3:'The ordinary calendar answers the question “what date is it today” — the way the whole world agreed to. The special one answers a different question: “where am I inside the year”. In it the year is divided into equal parts with nothing left over, so you see how the year is built, not just a list of numbers. Every day is shown in both calendars at once and joined by the thread: to learn which special day a Gregorian date falls on, there is nothing to calculate.',\n    helpUnitsCol1:'Unit', helpUnitsCol2:'Made of', helpUnitsCol3:'Gregorian days',\n    helpWhy279Note:'486 is the only number that lets a year be split into three equal periods, and a period into whole 27-day months. On top of that, 27 days is the sidereal month of the Moon (exactly 27.32 days, a difference of 1.2 %; the familiar synodic month of 29.53 days would differ by 8.6 %), and 9 is a natural size for a small group inside 27. This explains why these numbers were chosen; it is not an astronomical claim.',\n    helpSeam:'Four Gregorian years are 1461 days, and 1461 does not divide by 27: three days are left over. They are spread one per year, so the last Delya of a year becomes ten days long and the last, 18th month becomes 28 days. That extra day is the seam: day 487 of the year, address 18·3·10. It is handier than leaving days “outside the count”: no day falls out, every day has an address, and an event can be put on the seam. If a four-year span touches February of a non-leap century (2100, 2200, 2300), it holds 1460 days — then the third year of the cycle gets 486 days and has no seam.',\n    helpRhythmNote:'month of the year (1–18) · Delya in the month (1–3) · day in the Delya (1–9, and 10 on the seam)',\n    helpAddrNote:'cycle.year of the cycle (1–3) : month (01–18) : day of the month (01–27, and 28 in the last month of a long year)',\n    helpBridgeNote:'The bridge shows how the day-of-year number is built from whole parts: 27×8 + 9×1 + 7 = 232.',\n    helpSecToday:'The selected day shown large and in both calendars at once: the ordinary date, the rhythm, the address and the place inside the year.',\n    helpSecGrids:'The main screen: the ordinary month on the left, the special year on the right. The same day is highlighted in both grids and joined by the thread.',\n    helpSecCircle:'A dot is a month, a block is a cycle; a block holds three year-rows of 18 months. At the top you switch the span: a single cycle of 1461 days or the whole round of 13 149 days (36 years). A click on a month opens its first day in “Grids”.',\n    helpSecEvents:'The coming events with their repeats; new ones are added here too.',\n    helpSecSettings:'Theme, thread look, your own unit names, the epoch, reminders and data export.',\n    helpThread:'The thread joins the same day in the ordinary and the special grid. Click any day — the other grid highlights the same day, and the caption shows its second date. If the thread gets in the way, its look is changed in Settings: lane, arc, straight line, or no thread at all.',\n    helpEvents:'A repeat is set both by the ordinary calendar (every N days, on weekdays, on the Nth of the month, yearly) and by the special one — for instance, to the start of every Delya or on the seam day. Special repeats are recalculated from the epoch. Events and notes are kept only in this browser, so exporting JSON is the only way to move them to another phone.',\n    helpKeys:'← → — one day back and forward · T (or Е) — today · 1…6 — sections · ? — help · Esc — close the window',\n    helpKeysCap:'Keys', helpGotoCap:'The “go to” field',\n    unitRowDelyaB:'9 days (the last one in the year — 10)', unitRowMonthB:'3 Delyas',\n    unitRowMonthC:'27 (the last one in the year — 28)', unitRowPeriodB:'6 months',\n    unitRowYearB:'3 periods = 18 months = 54 Delyas', unitRowCycleB:'3 years',\n    unitRowCycleC:'1461 = 4 Gregorian years', unitRowRingB:'9 cycles = 27 years', unitRowRingC:'13 149 = 36 years',\n    years4:'4 Gregorian years', years36:'36 years',\n    gotoRow1:'an ordinary date, the year is optional', gotoRow3a:'9 Aug 2026', gotoRow3b:'month name',\n    gotoRow4:'rhythm: month · Delya · day of Delya, in the current year',\n    gotoRow5:'full address: cycle.year : month : day of month',\n
